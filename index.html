<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carteira Digital</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <!-- TELA DE LOGIN -->
    <div id="tela-login" class="container" style="text-align: center; padding: 60px 20px;">
        <h2>Carteira Digital</h2>
        <p style="margin-bottom: 25px; color: var(--text-muted);">Faça login para gerenciar suas finanças de forma privada e segura.</p>
        <button id="btn-login" class="btn-google">
            <svg width="18" height="18" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
            Entrar com o Google
        </button>
    </div>

    <!-- APLICATIVO PRINCIPAL (Fica escondido até fazer login) -->
    <div id="app-principal" class="container" style="display: none;">
        
        <!-- Cabeçalho do Usuário -->
        <div class="user-header">
            <div class="user-info">
                <img id="user-foto" src="" alt="Foto">
                <span id="user-nome">Usuário</span>
            </div>
            <button id="btn-logout" title="Sair da Conta">Sair</button>
        </div>

        <!-- Barra de Ferramentas -->
        <div class="toolbar">
            <button id="btn-tema" title="Alternar Modo Escuro">🌙</button>
            <input type="month" id="filtro-mes" title="Filtrar por Mês">
            <button id="btn-exportar" title="Baixar Planilha">📥 Exportar</button>
        </div>

        <h2>Meu Controle Financeiro</h2>
        
        <div class="painel-valores">
            <div class="caixa receita-caixa">
                <h3>Receitas</h3>
                <p id="total-receitas">R$ 0.00</p>
            </div>
            <div class="caixa despesa-caixa">
                <h3>Despesas</h3>
                <p id="total-despesas">R$ 0.00</p>
            </div>
            <div class="card pendentes">
    <h3>A Pagar (Pendente)</h3>
    <p id="total-pendente">R$ 0,00</p>
</div>
            <div class="caixa saldo-caixa">
                <h3>Saldo Atual</h3>
                <p id="saldo">R$ 0.00</p>
            </div>
        </div>

        <h3>Resumo por Categoria (Pagos)</h3>
        <div class="grafico-container">
            <canvas id="meuGrafico"></canvas>
        </div>

        <h3 id="titulo-formulario">Nova Transação</h3>
        <form id="form">
            <div class="form-group">
                <label for="texto">Descrição</label>
                <input type="text" id="texto" placeholder="Ex: Conta de Luz..." required>
            </div>

            <div class="form-group">
                <label>Tipo</label>
                <div class="radio-group">
                    <input type="radio" id="tipo-receita" name="tipo" value="receita" checked>
                    <label for="tipo-receita" class="radio-label">Receita</label>
                    <input type="radio" id="tipo-despesa" name="tipo" value="despesa">
                    <label for="tipo-despesa" class="radio-label">Despesa</label>
                </div>
            </div>

            <div class="form-group">
                <label for="categoria">Categoria</label>
                <select id="categoria" required>
                    <option value="Salário">Salário</option>
                    <option value="Alimentação">Alimentação</option>
                    <option value="Transporte">Transporte</option>
                    <option value="Moradia">Moradia</option>
                    <option value="Lazer">Lazer</option>
                    <option value="Cartão">Cartão</option>
                    <option value="Outros">Outros</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="valor">Valor</label>
                <input type="number" id="valor" step="0.01" min="0.01" placeholder="Ex: 50.00" required>
            </div>

            <div class="form-group">
                <label for="data">Data de Vencimento/Pagamento</label>
                <input type="date" id="data" required>
            </div>

            <div class="form-group checkbox-group">
                <input type="checkbox" id="pago" checked>
                <label for="pago">Esta transação já foi paga/recebida?</label>
            </div>
            
            <div class="form-actions">
                <button type="submit" id="btn-submit">Adicionar Transação</button>
                <button type="button" id="btn-cancelar" style="display: none;">Cancelar Edição</button>
            </div>
        </form>

        <h3>Histórico do Mês</h3>
        <ul id="lista-transacoes"></ul>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
